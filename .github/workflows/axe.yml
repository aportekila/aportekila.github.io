name: Axe accessibility testing

# Reuses the already-built _site from the Deploy site run instead of rebuilding
# from scratch (Ruby/Python/Node setup, apt-get, jekyll build, purgecss) just to
# test accessibility on the same output that build already produced. Mirrors the
# pattern in broken-links-site.yml.
on:
  workflow_run:
    workflows: ["Deploy site"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/) — checked against the live production site"
        required: false

permissions:
  actions: read

env:
  PROD_URL: https://aportekila.github.io
  # Key pages checked on every push/PR (in addition to the manually-specified URL, if any)
  CHECK_URLS: >-
    /
    /cv/
    /portfolio/
    /publications/
    /projects/eppo.html
    /news/

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Download built site 📦
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Serve local build 🌐
        if: github.event_name == 'workflow_run'
        run: |
          npm install -g http-server
          http-server _site/ -p 8080 &
          sleep 2
          echo "BASE_URL=http://localhost:8080" >> "$GITHUB_ENV"

      - name: Use live site as base 🌐
        # Manual dispatch has no associated build artifact, so it checks whatever is
        # already deployed instead of rebuilding just to serve it locally.
        if: github.event_name == 'workflow_dispatch'
        run: echo "BASE_URL=${{ env.PROD_URL }}" >> "$GITHUB_ENV"

      - name: Install chromedriver 🚗
        # ubuntu-latest ships Google Chrome preinstalled at /opt/google/chrome/chrome, and that is
        # the binary axe-core's Selenium launcher actually uses — a separately installed browser
        # (e.g. via a "setup-chrome" action) sits unused alongside it and only causes chromedriver
        # to target the wrong version. So skip installing another Chrome build entirely and just
        # match chromedriver to the browser that will actually be launched.
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || echo /opt/google/chrome/chrome)
          echo "Chrome binary: $CHROME_BIN"
          CHROME_VERSION=$("$CHROME_BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CHROME_MAJOR=$(echo "$CHROME_VERSION" | cut -d. -f1)
          if [ -z "$CHROME_MAJOR" ]; then
            echo "::error::Could not determine installed Chrome version from '$CHROME_BIN --version'"
            exit 1
          fi
          echo "Installed Chrome: $CHROME_VERSION (major $CHROME_MAJOR)"
          npm install -g chromedriver@$CHROME_MAJOR

      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          npm install -g @axe-core/cli
          CHROMEDRIVER=$(npm root -g)/chromedriver/bin/chromedriver
          status=0
          if [ -n "${{ github.event.inputs.url }}" ]; then
            URLS="/${{ github.event.inputs.url }}"
          else
            URLS="$CHECK_URLS"
          fi
          for path in $URLS; do
            # collapse a possible double leading slash (manual input already starting with "/")
            path="/${path#/}"
            echo "=== axe $path ==="
            # guard against GitHub Actions' default `set -e`: without the if/else, a nonzero
            # exit here would abort the script immediately, before we can even read $? below
            if axe --chromedriver-path "$CHROMEDRIVER" "${BASE_URL}$path" --load-delay=1500 --exit; then
              rc=0
            else
              rc=$?
            fi
            echo "--- axe exit code for $path: $rc ---"
            if [ $rc -ne 0 ]; then
              status=1
            fi
          done
          echo "=== final status: $status ==="
          exit $status
