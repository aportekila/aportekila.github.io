name: Axe accessibility testing

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""
  # Key pages checked on every push/PR (in addition to the manually-specified URL, if any)
  CHECK_URLS: >-
    /
    /cv/
    /portfolio/
    /publications/
    /projects/eppo.html
    /news/

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install chromedriver 🚗
        # Derive the chromedriver version from the Chrome version actually installed above,
        # rather than re-fetching "latest stable" independently — the two registries can be
        # out of sync (e.g. Chrome resolves to 150.x while a separately-fetched "latest" is 151),
        # which causes ChromeDriver to refuse the session with a version mismatch.
        run: |
          CHROME_VERSION="${{ steps.setup-chrome.outputs.chrome-version }}"
          CHROME_MAJOR=$(echo "$CHROME_VERSION" | cut -d. -f1)
          echo "Installed Chrome: $CHROME_VERSION (major $CHROME_MAJOR)"
          npm install -g chromedriver@$CHROME_MAJOR
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          sudo npm install -g @axe-core/cli
          sudo npm install -g http-server
          http-server _site/ &
          sleep 2
          CHROMEDRIVER=$(npm root -g)/chromedriver/bin/chromedriver
          status=0
          if [ -n "${{ github.event.inputs.url }}" ]; then
            URLS="/${{ github.event.inputs.url }}"
          else
            URLS="$CHECK_URLS"
          fi
          for path in $URLS; do
            # collapse a possible double leading slash (manual input already starting with "/")
            path="/${path#/}"
            echo "=== axe $path ==="
            axe --chromedriver-path "$CHROMEDRIVER" "http://localhost:8080$path" --load-delay=1500 --exit || status=1
          done
          exit $status
