---
layout: house
title: İlanlar
permalink: /house-renting/
house_page: list
leaflet: true
sitemap: false
---
<div class="h-list-layout">
  <aside class="h-filters" id="filters" aria-label="Filtreler">
    <div class="h-filters-head">
      <strong>Filtreler</strong>
      <button type="button" class="h-btn h-btn-small" id="reset-filters">Sıfırla</button>
      <button type="button" class="h-btn h-btn-small h-only-mobile" id="close-filters">Kapat</button>
    </div>
    <div id="filter-panel"><p class="h-muted">Yükleniyor…</p></div>
  </aside>
  <section class="h-results">
    <div class="h-toolbar">
      <button type="button" class="h-btn h-only-mobile" id="open-filters">Filtreler</button>
      <input type="search" id="search" class="h-input" placeholder="Ara: başlık, mahalle, site, özellik…" aria-label="Metin araması">
      <div class="h-seg" role="group" aria-label="Yolculuk tipi">
        <button type="button" data-mode="transit">🚌 Toplu taşıma</button>
        <button type="button" data-mode="drive">🚗 Araç</button>
      </div>
      <label class="h-sort">Sırala
        <select id="sort" class="h-input"></select>
      </label>
      <button type="button" class="h-btn" id="sort-dir" title="Sıralama yönü">↑</button>
      <div class="h-seg" role="group" aria-label="Görünüm">
        <button type="button" data-view="list">Liste</button>
        <button type="button" data-view="map">Harita</button>
      </div>
    </div>
    <p class="h-count" id="count" aria-live="polite"></p>
    <div id="active-chips" class="h-active-chips"></div>
    <div id="map" class="h-map" hidden></div>
    <div id="cards" class="h-cards"></div>
  </section>
</div>
<div class="h-compare-bar" id="compare-bar" hidden>
  <span id="compare-bar-text"></span>
  <button type="button" class="h-btn" id="compare-clear">Temizle</button>
  <a class="h-btn h-btn-primary" href="{{ '/house-renting/compare/' | relative_url }}">Karşılaştır →</a>
</div>
